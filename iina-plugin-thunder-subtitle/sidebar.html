<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thunder Subtitle</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px;
      color: -apple-system-label;
      font: -apple-system-body;
    }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 16px; color: -apple-system-secondary-label; line-height: 1.45; }
    .status {
      padding: 10px 12px;
      border: 1px solid -apple-system-separator;
      border-radius: 6px;
      background: -apple-system-control-background;
      line-height: 1.4;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Thunder Subtitle</h1>
  <p>迅雷字幕提供器已经加载。</p>
  <div class="status">
    播放视频后，打开“字幕”菜单，选择“查找在线字幕…”，再选择 <code>Thunder Subtitle</code>。
  </div>
</body>
</html>
